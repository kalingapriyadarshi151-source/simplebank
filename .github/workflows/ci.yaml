name: ci test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    name: test
    runs-on: ubuntu-latest

    steps:

    - name: Set up Go 1.x 
      uses: actions/setup-go@v4

      with:
        go-version: '1.27'
      id: go 
    
    - name: checkout code into the go module directory 
      uses: actions/checkout@v4

    - name: Test
      run: make test
